<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вектор | Нет доступа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        .app-logo-img {
            max-width: 180px;
            height: auto;
        }
        
        .no-access-message {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 24px;
            margin: 50px auto;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .no-access-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .no-access-message h3 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .no-access-message p {
            color: var(--gray);
            margin-bottom: 10px;
        }
        
        .return-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .return-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Вектор" class="app-logo-img">
                <p class="app-subtitle">Управление вахтовым персоналом</p>
            </div>
        </div>
        
        <div class="no-access-message">
            <div class="no-access-content">
                <i class="fas fa-lock" style="font-size: 64px; color: var(--primary); margin-bottom: 20px;"></i>
                <h3>⛔ Доступ запрещён</h3>
                <p>{{ message if message else 'У вас нет прав для просмотра этой страницы.' }}</p>
                <button onclick="window.location.href='{{ return_url if return_url else '/welcome' }}'" class="return-btn">
                    <i class="fas fa-home"></i> Вернуться на главную
                </button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/auth/me', { credentials: 'include' });
                if (response.ok) {
                    const user = await response.json();
                    const headerRight = document.querySelector('.header-right');
                    if (headerRight && !document.querySelector('.user-info')) {
                        headerRight.innerHTML = `
                            <div class="user-info">
                                <div class="user-info-container">
                                    <div class="user-badge">
                                        <i class="fas fa-user-circle"></i>
                                        ${escapeHtml(user.full_name || user.username)}
                                    </div>
                                    <button class="logout-button" onclick="logout()">
                                        <i class="fas fa-sign-out-alt"></i> Выйти
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }
            } catch(e) {}
        });
        
        function logout() {
            fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
                .then(() => { window.location.href = '/'; });
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
