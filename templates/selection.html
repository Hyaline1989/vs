<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Подбор объектов - CRM Комплект</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .app-logo-img {
            max-width: 180px;
            height: auto;
        }
        
        .position-stats {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }
        .position-stats span {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 15px;
        }
        .no-positions {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }
        @media (max-width: 768px) {
            .position-stats {
                flex-direction: column;
                gap: 5px;
            }
        }
        
        .requirements-modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            overflow: auto;
        }
        .requirements-modal-content {
            background-color: #fff;
            margin: 2% auto;
            padding: 0;
            border-radius: 12px;
            width: 95%;
            max-width: 1400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.3s;
        }
        .requirements-modal-header {
            background: #A42C30;
            color: white;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .requirements-modal-header h3 {
            margin: 0;
        }
        .requirements-modal-close {
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
        }
        .requirements-modal-close:hover {
            color: #ccc;
        }
        .requirements-modal-body {
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .requirements-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .requirements-table thead tr:first-child th {
            position: sticky;
            top: 0;
            background: #f5f5f5;
            z-index: 11;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .requirements-table thead tr:nth-child(2) th {
            position: sticky;
            top: 45px;
            background: #f5f5f5;
            z-index: 10;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .requirements-table td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        
        .requirements-table input {
            width: 70px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .object-group {
            background-color: #f9f9f9;
        }
        .object-name-cell {
            background-color: #e8e8e8;
            font-weight: bold;
            text-align: left !important;
        }
        .priority-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .requirements-modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            text-align: right;
            background: #fafafa;
            border-radius: 0 0 12px 12px;
        }
        .btn-save-req {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save-req:hover {
            background: #219a52;
        }
        .btn-cancel-req {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }
        .btn-cancel-req:hover {
            background: #5a6268;
        }
        .high-priority-row {
            background-color: #fff3cd !important;
        }
        .total-row {
            background-color: #e8f4f8;
            font-weight: bold;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ШАПКА -->
        <div class="app-header">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Вектор" class="app-logo-img">
                <div class="app-subtitle">Система подбора персонала по объектам</div>
            </div>
            <div class="header-right">
                <div class="system-switcher">
                    <button class="system-btn" onclick="window.location.href='/dashboard'">
                        <i class="fas fa-chart-line"></i> <span>Дашборд</span>
                    </button>
                    <button class="system-btn active" onclick="window.location.href='/selection'">
                        <i class="fas fa-bullseye"></i> <span>Подбор объектов</span>
                    </button>
                    {% if current_user.is_authenticated and current_user.can_view_worker_status() %}
                    <button class="system-btn" onclick="window.location.href='/worker-status'">
                        <i class="fas fa-users"></i>
                        <span>Вахтовики</span>
                    </button>
                    {% endif %}
                    <button class="system-btn" id="adminPanelBtn" style="display: none;" onclick="window.location.href='/admin'">
                        <i class="fas fa-users-cog"></i> <span>Админ-панель</span>
                    </button>
                </div>
                <div class="user-info" id="userInfo"></div>
            </div>
        </div>

        <!-- Админ-контролы (видны только админам) -->
        <div id="adminControls" class="admin-controls" style="display: none;">
            <h3><i class="fas fa-crown"></i> Управление объектами</h3>
            <div class="admin-buttons">
                <button class="admin-btn save" onclick="saveGlobalOrder()">Сохранить порядок</button>
                {% if current_user.role == 'admin' %}
                <button class="admin-btn manage-req" onclick="openRequirementsModal()" style="background: #6c757d;">📊 Управление потребностью</button>
                {% endif %}
            </div>
        </div>

        <!-- Отладочная информация (только для админов) -->
        <div class="debug-controls">
            <button class="debug-toggle" onclick="toggleDebug()">Отладка</button>
        </div>
        <div id="debugInfo" class="debug-info" style="display: none;"></div>

        <!-- ФИЛЬТРЫ -->
        <div class="filters">
            <div class="filter-group">
                <label for="age">Возраст кандидата</label>
                <input type="number" id="age" value="25" min="18" max="70" step="1" onchange="filterAndDisplayObjects()">
            </div>
            <div class="filter-group">
                <label for="gender">Пол</label>
                <select id="gender" onchange="filterAndDisplayObjects()">
                    <option value="все">Все</option>
                    <option value="мужчина">Мужчина</option>
                    <option value="женщина">Женщина</option>
                    <option value="семейные">Семейные пары</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="nationality">Гражданство</label>
                <select id="nationality" onchange="filterAndDisplayObjects()">
                    <option value="РФ">РФ</option>
                    <option value="СНГ">СНГ</option>
                    <option value="все">Все</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="hasConviction">Наличие судимости</label>
                <select id="hasConviction" onchange="filterAndDisplayObjects()">
                    <option value="false">Без судимости</option>
                    <option value="true">С судимостью</option>
                </select>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div class="results-count" id="resultsCount"></div>
        <div id="results" class="results-grid"></div>

        <!-- МЕНЮ УПРАВЛЕНИЯ ОБЪЕКТАМИ (для админов) -->
        <div id="objectMenu" class="object-menu" style="display: none;">
            <div class="menu-header">
                <h3><i class="fas fa-list"></i> Управление объектами</h3>
                <button class="menu-close" onclick="toggleObjectMenu()">✕</button>
            </div>
            <div class="menu-controls">
                <button onclick="saveGlobalOrder()">Сохранить порядок</button>
            </div>
            <div id="menuItems" class="menu-items"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='selection.js') }}"></script>
    <script src="{{ url_for('static', filename='passport_viewer.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/api/auth/me', { credentials: 'include' });
                if (response.ok) {
                    const user = await response.json();
                    if (user.role === 'admin' || user.is_system_admin) {
                        const adminBtn = document.getElementById('adminPanelBtn');
                        if (adminBtn) adminBtn.style.display = 'flex';
                    } else if (user.role === 'manager') {
                        const adminBtn = document.getElementById('adminPanelBtn');
                        if (adminBtn) adminBtn.style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки прав:', error);
            }
            
            await loadSelectionData();
            
            const ageInput = document.getElementById('age');
            if (ageInput) {
                ageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        filterAndDisplayObjects();
                    }
                });
            }
        });
        
        function toggleObjectMenu() {
            const menu = document.getElementById('objectMenu');
            if (menu) {
                if (menu.style.display === 'none' || menu.style.display === '') {
                    menu.style.display = 'block';
                    document.body.style.overflow = 'hidden';
                } else {
                    menu.style.display = 'none';
                    document.body.style.overflow = '';
                }
            }
        }
        
        function addMobileMenuButton() {
            if (window.innerWidth <= 768 && window.isAdmin) {
                let menuBtn = document.getElementById('mobileMenuBtn');
                if (!menuBtn) {
                    menuBtn = document.createElement('button');
                    menuBtn.id = 'mobileMenuBtn';
                    menuBtn.className = 'mobile-menu-toggle';
                    menuBtn.innerHTML = '<i class="fas fa-bars"></i>';
                    menuBtn.onclick = toggleObjectMenu;
                    document.body.appendChild(menuBtn);
                }
            } else {
                const menuBtn = document.getElementById('mobileMenuBtn');
                if (menuBtn) menuBtn.remove();
            }
        }
        
        window.addEventListener('resize', function() {
            addMobileMenuButton();
        });
        
        setTimeout(addMobileMenuButton, 1000);
    </script>
<!-- Footer -->
<footer class="app-footer">
    <div class="footer-links">
        <a href="/faq">
            <i class="fas fa-question-circle"></i> FAQ
        </a>
    </div>
    <div class="footer-copyright">
        <p>© 2026 Вектор — Управление вахтовым персоналом. Все права защищены.</p>
    </div>
</footer>
</body>
</html>
