<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вектор | FAQ - Руководство по работе с системой</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        .app-logo-img {
            max-width: 180px;
            height: auto;
        }
        
        .faq-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        
        .faq-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        
        .faq-header h2 {
            color: var(--dark);
            font-size: 1.8rem;
        }
        
        .faq-header h2 i {
            color: var(--primary);
            margin-right: 10px;
        }
        
        .faq-header p {
            color: var(--gray);
            margin-top: 10px;
        }
        
        .faq-categories {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .category-btn {
            background: #f8f9fa;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            color: var(--dark);
        }
        
        .category-btn:hover {
            background: rgba(164, 44, 48, 0.1);
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .faq-item {
            border: 1px solid #e9ecef;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .faq-item:hover {
            border-color: rgba(164, 44, 48, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .faq-question {
            padding: 18px 20px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--dark);
            transition: background 0.3s;
            font-size: 1.05rem;
        }
        
        .faq-question:hover {
            background: rgba(164, 44, 48, 0.02);
        }
        
        .faq-question i {
            color: var(--primary);
            transition: transform 0.3s;
        }
        
        .faq-item.open .faq-question i {
            transform: rotate(90deg);
        }
        
        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: #555;
            line-height: 1.7;
            border-top: none;
            font-size: 0.95rem;
        }
        
        .faq-item.open .faq-answer {
            padding: 0 20px 20px 20px;
            max-height: 2000px;
            border-top: 1px solid #e9ecef;
        }
        
        .faq-answer p {
            margin: 12px 0;
        }
        
        .faq-answer h4 {
            color: var(--primary);
            margin: 15px 0 8px 0;
            font-size: 1rem;
        }
        
        .faq-answer ul, .faq-answer ol {
            margin: 10px 0;
            padding-left: 25px;
        }
        
        .faq-answer li {
            margin: 6px 0;
        }
        
        .faq-answer .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .warning {
            background: #fee2e2;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .info {
            background: #e3f2fd;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .danger {
            background: #fee2e2;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .return-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--primary);
            text-decoration: none;
            text-align: center;
            width: 100%;
        }
        
        .return-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .faq-container {
                padding: 20px;
                margin: 10px;
            }
            
            .faq-header h2 {
                font-size: 1.3rem;
            }
            
            .category-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            
            .faq-question {
                padding: 14px 16px;
                font-size: 0.9rem;
            }
            
            .faq-item.open .faq-answer {
                padding: 0 16px 16px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Вектор" class="app-logo-img">
                <p class="app-subtitle">Управление вахтовым персоналом</p>
            </div>
            {% if current_user.is_authenticated %}
            <div class="header-right">
                <div class="system-switcher">
                    <button class="system-btn" onclick="window.location.href='/dashboard'">
                        <i class="fas fa-chart-line"></i>
                        <span>Дашборд</span>
                    </button>
                    <button class="system-btn" onclick="window.location.href='/selection'">
                        <i class="fas fa-user-check"></i>
                        <span>Подбор объектов</span>
                    </button>
                    <button class="system-btn" onclick="window.location.href='/worker-status'">
                        <i class="fas fa-users"></i>
                        <span>Вахтовики</span>
                    </button>
                    {% if current_user.role == 'admin' or current_user.role == 'manager' %}
                    <button class="system-btn" onclick="window.location.href='/admin'">
                        <i class="fas fa-users-cog"></i>
                        <span>Админ-панель</span>
                    </button>
                    {% endif %}
                </div>
                <div class="user-info" id="userInfo"></div>
            </div>
            {% endif %}
        </div>

        <div class="faq-container">
            <div class="faq-header">
                <h2><i class="fas fa-book-open"></i> Руководство пользователя</h2>
                <p>Полное описание работы всех модулей системы "Вектор"</p>
            </div>

            <div class="faq-categories">
                <button class="category-btn active" data-category="all">Все разделы</button>
                <button class="category-btn" data-category="dashboard">📊 Дашборд План/Факт</button>
                <button class="category-btn" data-category="selection">🎯 Подбор объектов</button>
                <button class="category-btn" data-category="admin">⚙️ Администрирование</button>
                <button class="category-btn" data-category="profile">👤 Личный кабинет</button>
                <button class="category-btn" data-category="technical">🔧 Технические особенности</button>
            </div>

            <div class="faq-list" id="faqList">
                <div class="loading">Загрузка руководства...</div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="/welcome" class="return-link">
                    <i class="fas fa-arrow-left"></i> Вернуться на главную
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script>
        // Данные руководства
        const faqData = [
            {
                category: "dashboard",
                question: "📊 Дашборд План/Факт - общее описание",
                answer: `
                    <p>Дашборд План/Факт — это основной аналитический инструмент системы, который позволяет в реальном времени отслеживать выполнение плана по направлению персонала на объекты.</p>
                    
                    <div class="info">
                        <strong>📌 Основное назначение:</strong> Сравнение плановых показателей потребности в персонале с фактически направленными кандидатами за выбранную дату.
                    </div>
                    
                    <h4>🏢 Левая панель — Офисы:</h4>
                    <p>Отображает количество направленных кандидатов в разрезе офисов (источников). Каждый офис можно развернуть/свернуть, чтобы увидеть детальную разбивку по объектам.</p>
                    
                    <h4>📈 Правая панель — План/Факт:</h4>
                    <p>Отображает сравнение плановых показателей с фактическими по каждому объекту. Объекты с 🔥 приоритетом отображаются в начале списка.</p>
                    
                    <div class="note">
                        <strong>📌 Важно!</strong> Дашборд всегда отражает <strong>МАКСИМАЛЬНУЮ потребность</strong> за день.
                    </div>
                `
            },
            {
                category: "dashboard",
                question: "📅 Работа с датами и отчётами",
                answer: `
                    <p>Дашборд позволяет просматривать данные за любую прошедшую дату, а также формировать отчёты за период.</p>
                    
                    <h4>🗓 Выбор даты:</h4>
                    <p>Используйте календарь в верхней части дашборда для выбора нужной даты. Данные обновляются автоматически.</p>
                    
                    <h4>📥 Выгрузка отчёта:</h4>
                    <p>В правой панели выберите начальную и конечную дату отчёта и нажмите кнопку "Скачать отчёт". Отчёт выгружается в формате CSV.</p>
                    
                    <h4>🔄 Обновление данных:</h4>
                    <p>Данные автоматически обновляются каждые 15 минут. Для ручного обновления нажмите кнопку "Обновить".</p>
                `
            },
            {
                category: "selection",
                question: "🎯 Подбор объектов - общее описание",
                answer: `
                    <p>Модуль "Подбор объектов" предназначен для быстрого поиска подходящих вакансий для кандидатов на основе их характеристик.</p>
                    
                    <h4>Как это работает:</h4>
                    <p>Система анализирует текущие потребности в персонале по каждому объекту и сопоставляет их с параметрами кандидата: возраст, пол, гражданство, наличие судимости.</p>
                    
                    <div class="info">
                        <strong>📌 Важно:</strong> Отображаются только объекты, у которых есть актуальная потребность в персонале.
                    </div>
                    
                    <h4>🎴 Карточки объектов:</h4>
                    <p>Каждый объект представлен в виде переворачивающейся карточки. Нажмите кнопку "Подробнее о должностях", чтобы перевернуть карточку.</p>
                `
            },
            {
                category: "selection",
                question: "🔧 Управление текущими потребностями (для администратора)",
                answer: `
                    <p>Администратор может управлять текущими потребностями в персонале через специальное модальное окно.</p>
                    
                    <h4>Как открыть редактор потребностей:</h4>
                    <p>На странице подбора объектов нажмите кнопку "Управление потребностью" (доступно только администратору).</p>
                    
                    <h4>Редактирование потребностей:</h4>
                    <p>В таблице можно изменять числовые значения потребности по каждому типу кандидатов. Итоги пересчитываются автоматически. Флажок "Приоритет" делает объект приоритетным.</p>
                    
                    <div class="warning">
                        <strong>⚠️ Важно!</strong> При сохранении потребностей дашборд обновляется и сохраняет МАКСИМАЛЬНОЕ значение потребности за день.
                    </div>
                `
            },
            {
                category: "admin",
                question: "👥 Управление пользователями и правами",
                answer: `
                    <p>Админ-панель предоставляет полный контроль над пользователями системы и их правами доступа.</p>
                    
                    <h4>Роли пользователей:</h4>
                    <ul>
                        <li><strong>Администратор</strong> — полный доступ ко всем функциям</li>
                        <li><strong>Руководитель</strong> — может управлять менеджерами и их правами</li>
                        <li><strong>Менеджер</strong> — ограниченный доступ к дашборду и подбору объектов</li>
                    </ul>
                    
                    <h4>Управление правами:</h4>
                    <p>Можно настраивать доступ к модулям и к конкретным объектам для менеджеров.</p>
                `
            },
            {
                category: "profile",
                question: "👤 Личный кабинет и профиль пользователя",
                answer: `
                    <p>В личном кабинете каждый пользователь может управлять своей персональной информацией.</p>
                    
                    <h4>Доступные действия:</h4>
                    <ul>
                        <li>Редактирование профиля — изменение полного имени и email</li>
                        <li>Смена пароля — требуется ввод текущего пароля</li>
                        <li>Загрузка аватара — изображение будет сжато до 500x500px</li>
                        <li>Удаление аватара</li>
                    </ul>
                `
            },
            {
                category: "technical",
                question: "🔧 Технические особенности и нюансы работы",
                answer: `
                    <h4>📊 Особенности дашборда:</h4>
                    <ul>
                        <li>Дашборд отражает МАКСИМАЛЬНУЮ потребность за день</li>
                        <li>Приоритеты объектов сохраняются в истории</li>
                        <li>Данные кешируются на 60 секунд</li>
                    </ul>
                    
                    <h4>🎯 Особенности подбора объектов:</h4>
                    <ul>
                        <li>Используются текущие потребности (без привязки к дате)</li>
                        <li>Если потребность по объекту равна 0, он не отображается</li>
                    </ul>
                    
                    <h4>📁 Файловые ограничения:</h4>
                    <ul>
                        <li>Маршрутные листы: максимум 30 MB, только PDF</li>
                        <li>Аватары: максимум 2 MB, форматы PNG, JPG, GIF, WEBP</li>
                    </ul>
                    
                    <div class="danger">
                        <strong>⚠️ Если вы не видите данные:</strong><br>
                        1. Проверьте подключение к интернету<br>
                        2. Обновите страницу (Ctrl+F5)<br>
                        3. Проверьте, авторизованы ли вы<br>
                        4. Обратитесь к администратору
                    </div>
                `
            }
        ];

        let currentCategory = "all";

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderFAQ() {
            const container = document.getElementById('faqList');
            if (!container) return;
            
            let filteredData = faqData;
            
            if (currentCategory !== "all") {
                filteredData = filteredData.filter(item => item.category === currentCategory);
            }
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="faq-empty">
                        <i class="fas fa-folder-open"></i>
                        <p>В этом разделе пока нет материалов</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            filteredData.forEach((item) => {
                const safeQuestion = escapeHtml(item.question);
                
                html += `
                    <div class="faq-item" data-category="${item.category}">
                        <div class="faq-question" onclick="toggleFAQ(this)">
                            <span>${safeQuestion}</span>
                            <i class="fas fa-chevron-right"></i>
                        </div>
                        <div class="faq-answer">
                            ${item.answer}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function toggleFAQ(element) {
            const faqItem = element.closest('.faq-item');
            if (!faqItem) return;
            faqItem.classList.toggle('open');
        }
        
        function filterByCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            
            renderFAQ();
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            renderFAQ();
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterByCategory(btn.dataset.category);
                });
            });
        });
        
        window.toggleFAQ = toggleFAQ;
        window.filterByCategory = filterByCategory;
    </script>
</body>
</html>
