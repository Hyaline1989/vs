<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вектор | FAQ - Руководство по работе с системой</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        .app-logo-img {
            max-width: 180px;
            height: auto;
        }
        
        .faq-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        
        .faq-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        
        .faq-header h2 {
            color: var(--dark);
            font-size: 1.8rem;
        }
        
        .faq-header h2 i {
            color: var(--primary);
            margin-right: 10px;
        }
        
        .faq-header p {
            color: var(--gray);
            margin-top: 10px;
        }
        
        .faq-categories {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .category-btn {
            background: #f8f9fa;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            color: var(--dark);
        }
        
        .category-btn:hover {
            background: rgba(164, 44, 48, 0.1);
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .faq-item {
            border: 1px solid #e9ecef;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .faq-item:hover {
            border-color: rgba(164, 44, 48, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .faq-question {
            padding: 18px 20px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--dark);
            transition: background 0.3s;
            font-size: 1.05rem;
        }
        
        .faq-question:hover {
            background: rgba(164, 44, 48, 0.02);
        }
        
        .faq-question i {
            color: var(--primary);
            transition: transform 0.3s;
        }
        
        .faq-item.open .faq-question i {
            transform: rotate(90deg);
        }
        
        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: #555;
            line-height: 1.7;
            border-top: none;
            font-size: 0.95rem;
        }
        
        .faq-item.open .faq-answer {
            padding: 0 20px 20px 20px;
            max-height: 2000px;
            border-top: 1px solid #e9ecef;
        }
        
        .faq-answer p {
            margin: 12px 0;
        }
        
        .faq-answer h4 {
            color: var(--primary);
            margin: 15px 0 8px 0;
            font-size: 1rem;
        }
        
        .faq-answer ul, .faq-answer ol {
            margin: 10px 0;
            padding-left: 25px;
        }
        
        .faq-answer li {
            margin: 6px 0;
        }
        
        .faq-answer .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .warning {
            background: #fee2e2;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .info {
            background: #e3f2fd;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer .danger {
            background: #fee2e2;
            border-left: 4px solid #e74c3c;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        
        .faq-answer code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .return-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--primary);
            text-decoration: none;
            text-align: center;
            width: 100%;
        }
        
        .return-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .faq-container {
                padding: 20px;
                margin: 10px;
            }
            
            .faq-header h2 {
                font-size: 1.3rem;
            }
            
            .category-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            
            .faq-question {
                padding: 14px 16px;
                font-size: 0.9rem;
            }
            
            .faq-item.open .faq-answer {
                padding: 0 16px 16px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Вектор" class="app-logo-img">
                <p class="app-subtitle">Управление вахтовым персоналом</p>
            </div>
            {% if current_user.is_authenticated %}
            <div class="header-right">
                <div class="system-switcher">
                    <button class="system-btn" onclick="window.location.href='/dashboard'">
                        <i class="fas fa-chart-line"></i>
                        <span>Дашборд</span>
                    </button>
                    <button class="system-btn" onclick="window.location.href='/selection'">
                        <i class="fas fa-user-check"></i>
                        <span>Подбор объектов</span>
                    </button>
                    {% if current_user.role == 'admin' or current_user.role == 'manager' %}
                    <button class="system-btn" onclick="window.location.href='/admin'">
                        <i class="fas fa-users-cog"></i>
                        <span>Админ-панель</span>
                    </button>
                    {% endif %}
                </div>
                <div class="user-info" id="userInfo"></div>
            </div>
            {% endif %}
        </div>

        <div class="faq-container">
            <div class="faq-header">
                <h2><i class="fas fa-book-open"></i> Руководство пользователя</h2>
                <p>Полное описание работы всех модулей системы "Вектор"</p>
            </div>

            <div class="faq-categories">
                <button class="category-btn active" data-category="all">Все разделы</button>
                <button class="category-btn" data-category="dashboard">📊 Дашборд План/Факт</button>
                <button class="category-btn" data-category="selection">🎯 Подбор объектов</button>
                <button class="category-btn" data-category="admin">⚙️ Администрирование</button>
                <button class="category-btn" data-category="profile">👤 Личный кабинет</button>
                <button class="category-btn" data-category="technical">🔧 Технические особенности</button>
            </div>

            <div class="faq-list" id="faqList">
                <div class="loading">Загрузка руководства...</div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="/welcome" class="return-link">
                    <i class="fas fa-arrow-left"></i> Вернуться на главную
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script>
        // Данные руководства
        const faqData = [
            // ========== ДАШБОРД ПЛАН/ФАКТ ==========
            {
                category: "dashboard",
                question: "📊 Дашборд План/Факт - общее описание",
                answer: `
                    <p>Дашборд План/Факт — это основной аналитический инструмент системы, который позволяет в реальном времени отслеживать выполнение плана по направлению персонала на объекты.</p>
                    
                    <div class="info">
                        <strong>📌 Основное назначение:</strong> Сравнение плановых показателей потребности в персонале с фактически направленными кандидатами за выбранную дату.
                    </div>
                    
                    <h4>🏢 Левая панель — Офисы:</h4>
                    <p>Отображает количество направленных кандидатов в разрезе офисов (источников):</p>
                    <ul>
                        <li><strong>Агент</strong> — направленные через агентов</li>
                        <li><strong>Поток</strong> — направленные через подразделение «Поток»</li>
                        <li><strong>Бишкек</strong> — направленные из офиса в Бишкеке</li>
                        <li><strong>Комплект</strong> — направленные через подразделение «Комплект»</li>
                    </ul>
                    <p>Каждый офис можно развернуть/свернуть, чтобы увидеть детальную разбивку по объектам. Число рядом с названием офиса — общее количество направленных за день.</p>
                    
                    <h4>📈 Правая панель — План/Факт:</h4>
                    <p>Отображает сравнение плановых показателей с фактическими по каждому объекту:</p>
                    <ul>
                        <li><strong>Зелёный бейдж</strong> — факт превышает план (перевыполнение)</li>
                        <li><strong>Красный бейдж</strong> — факт меньше плана (недовыполнение)</li>
                        <li><strong>Фиолетовый бейдж</strong> — факт равен плану (точное выполнение)</li>
                        <li><strong>Серый бейдж</strong> — план равен 0</li>
                    </ul>
                    <p>Объекты с 🔥 приоритетом отображаются в начале списка и выделены оранжевой рамкой.</p>
                    
                    <h4>📊 Блок сводной статистики:</h4>
                    <ul>
                        <li><strong>Всего нужно сегодня</strong> — суммарный план по всем объектам</li>
                        <li><strong>Всего направлено сегодня</strong> — суммарный факт по всем объектам</li>
                        <li><strong>Дельта</strong> — разница между фактом и планом (зелёная — перевыполнение, красная — недовыполнение)</li>
                        <li><strong>Обеспечено</strong> — процент выполнения плана, отображается в виде прогресс-бара</li>
                    </ul>
                    
                    <div class="note">
                        <strong>📌 Важно!</strong> Дашборд всегда отражает <strong>МАКСИМАЛЬНУЮ потребность</strong> за день. Если в течение дня потребность менялась (например, сначала требовалось 10 человек, потом 5), в дашборде останется максимальное значение — 10. Это сделано для корректного отражения пиковой нагрузки.
                    </div>
                `
            },
            {
                category: "dashboard",
                question: "🎯 Приоритеты объектов в дашборде",
                answer: `
                    <p>Система поддерживает механизм приоритетных объектов, которые требуют особого внимания.</p>
                    
                    <h4>🔥 Как работает приоритет:</h4>
                    <ul>
                        <li>Приоритетные объекты помечаются красным значком 🔥 в дашборде</li>
                        <li>Они всегда отображаются в начале списка, независимо от установленного порядка</li>
                        <li>Приоритет синхронизируется между дашбордом и модулем подбора объектов</li>
                    </ul>
                    
                    <div class="warning">
                        <strong>⚠️ Важное замечание!</strong><br>
                        Дашборд <strong>всегда сохраняет и отображает приоритеты</strong>, даже если они были убраны из текущих потребностей. Это сделано для того, чтобы исторические данные оставались корректными. Если вы сняли приоритет с объекта, но в дашборде за прошлые дни он всё ещё отображается — это нормально.
                    </div>
                    
                    <h4>🔄 Синхронизация приоритетов:</h4>
                    <p>При сохранении текущих потребностей через модальное окно в подборе объектов, приоритеты автоматически синхронизируются с дашбордом для текущей даты. Для прошлых дат приоритеты сохраняются в том виде, в котором были на тот момент.</p>
                `
            },
            {
                category: "dashboard",
                question: "📅 Работа с датами и отчётами",
                answer: `
                    <p>Дашборд позволяет просматривать данные за любую прошедшую дату, а также формировать отчёты за период.</p>
                    
                    <h4>🗓 Выбор даты:</h4>
                    <ul>
                        <li>Используйте календарь в верхней части дашборда для выбора нужной даты</li>
                        <li>Данные обновляются автоматически после выбора даты</li>
                        <li>Доступны только даты, по которым есть данные в системе</li>
                    </ul>
                    
                    <h4>📥 Выгрузка отчёта:</h4>
                    <ul>
                        <li>В правой панели выберите начальную и конечную дату отчёта</li>
                        <li>Нажмите кнопку "Скачать отчёт"</li>
                        <li>Отчёт выгружается в формате CSV с разделителем точка с запятой (;) для корректного открытия в Excel</li>
                        <li>Структура отчёта: Дата, Объект, План, Приоритет, Комплект, Поток, Горький52, Агент, Бишкек, Всего направлено</li>
                    </ul>
                    
                    // <div class="info">
                    //     <strong>💡 Совет:</strong> Для быстрого экспорта используйте предустановленные периоды — сегодня, вчера, текущая неделя (появится в следующем обновлении).
                    // </div>
                    
                    <h4>🔄 Обновление данных:</h4>
                    <ul>
                        <li>Данные автоматически обновляются каждые 15 минут</li>
                        <li>Для ручного обновления нажмите кнопку "Обновить" в правом верхнем углу</li>
                        <li>При обновлении очищается кеш и загружаются актуальные данные из Bitrix24 и базы данных</li>
                    </ul>
                `
            },
            
            // ========== ПОДБОР ОБЪЕКТОВ ==========
            {
                category: "selection",
                question: "🎯 Подбор объектов - общее описание",
                answer: `
                    <p>Модуль "Подбор объектов" предназначен для быстрого поиска подходящих вакансий для кандидатов на основе их характеристик.</p>
                    
                    <h4>Как это работает:</h4>
                    <p>Система анализирует текущие потребности в персонале по каждому объекту и сопоставляет их с параметрами кандидата:</p>
                    <ul>
                        <li><strong>Возраст</strong> — должен попадать в диапазон, установленный для объекта</li>
                        <li><strong>Пол</strong> — объект должен принимать кандидатов указанного пола</li>
                        <li><strong>Гражданство</strong> — гражданство кандидата должно быть в списке разрешённых</li>
                        <li><strong>Судимость</strong> — объект должен принимать кандидатов с судимостью (если она есть)</li>
                    </ul>
                    
                    <div class="info">
                        <strong>📌 Важно:</strong> Отображаются только объекты, у которых есть актуальная потребность в персонале. Если потребность равна 0, объект не показывается в результатах.
                    </div>
                    
                    <h4>🎴 Карточки объектов:</h4>
                    <p>Каждый объект представлен в виде переворачивающейся карточки:</p>
                    <ul>
                        <li><strong>Лицевая сторона</strong> — основная информация: потребность по полу (мужчины/женщины/семьи), возрастные ограничения, требования к гражданству и судимости</li>
                        <li><strong>Обратная сторона</strong> — детальная разбивка по должностям с указанием потребности по гражданству (РФ/СНГ) и полу</li>
                    </ul>
                    <p>Нажмите кнопку "Подробнее о должностях", чтобы перевернуть карточку.</p>
                `
            },
            {
                category: "selection",
                question: "🔧 Управление текущими потребностями (для администратора)",
                answer: `
                    <p>Администратор может управлять текущими потребностями в персонале через специальное модальное окно.</p>
                    
                    <h4>Как открыть редактор потребностей:</h4>
                    <ul>
                        <li>На странице подбора объектов нажмите кнопку "Управление потребностью" (доступно только администратору)</li>
                        <li>Откроется таблица со всеми объектами и должностями</li>
                    </ul>
                    
                    <h4>Редактирование потребностей:</h4>
                    <ul>
                        <li>В таблице можно изменять числовые значения потребности по каждому типу кандидатов (РФ мужчины, РФ женщины, РФ семьи, СНГ мужчины, СНГ женщины, СНГ семьи)</li>
                        <li>Итоги по каждому объекту и общий итог пересчитываются автоматически</li>
                        <li>Флажок "Приоритет" делает объект приоритетным — он будет выделяться в дашборде и подборе объектов</li>
                        <li>После всех изменений нажмите "Сохранить всё"</li>
                    </ul>
                    
                    <div class="warning">
                        <strong>⚠️ Важно!</strong> При сохранении потребностей дашборд обновляется и сохраняет МАКСИМАЛЬНОЕ значение потребности за день. Если вы уменьшите потребность, в дашборде за текущую дату останется предыдущее большее значение.
                    </div>
                    
                    <h4>➕ Добавление объектов и должностей:</h4>
                    <ul>
                        <li><strong>Добавить объект</strong> — кнопка в правом верхнем углу модального окна. При создании объекта нужно указать хотя бы одну должность</li>
                        <li><strong>Добавить должность</strong> — кнопка под названием объекта в таблице</li>
                        <li><strong>Удалить объект</strong> — кнопка "🗑 Удалить объект" под названием объекта</li>
                        <li><strong>Удалить должность</strong> — кнопка "✕" рядом с названием должности</li>
                    </ul>
                `
            },
            {
                category: "selection",
                question: "🎨 Порядок и фильтрация объектов",
                answer: `
                    <p>Система позволяет настраивать порядок отображения объектов в результатах подбора.</p>
                    
                    <h4>Фильтрация объектов:</h4>
                    <p>Используйте панель фильтров в верхней части страницы:</p>
                    <ul>
                        <li><strong>Возраст</strong> — введите возраст кандидата (подходят объекты, где возраст входит в диапазон)</li>
                        <li><strong>Пол</strong> — выберите пол кандидата (мужчина, женщина, семейные пары)</li>
                        <li><strong>Гражданство</strong> — РФ, СНГ, РБ или "Все"</li>
                        <li><strong>Наличие судимости</strong> — с судимостью или без</li>
                    </ul>
                    <p>Результаты фильтрации обновляются автоматически при изменении любого параметра.</p>
                    
                    <h4>Порядок объектов (только для администратора):</h4>
                    <ul>
                        <li>Для изменения порядка используйте перетаскивание карточек за значок ⋮⋮ в правом верхнем углу</li>
                        <li>После изменения порядка нажмите кнопку "Сохранить порядок" в панели управления</li>
                        <li>Порядок сохраняется глобально для всех пользователей</li>
                    </ul>
                    
                    <div class="info">
                        <strong>💡 Совет:</strong> Приоритетные объекты автоматически поднимаются в начало списка независимо от настроенного порядка. Сначала отображаются все приоритетные объекты, затем остальные в заданном порядке.
                    </div>
                    
                    <h4>📱 Мобильная версия:</h4>
                    <p>На мобильных устройствах карточки объектов отображаются в одну колонку. Для управления порядком объектов предусмотрена специальная плавающая кнопка меню.</p>
                `
            },
            
            // ========== АДМИНИСТРИРОВАНИЕ ==========
            {
                category: "admin",

        let currentCategory = "all";

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderFAQ() {
            const container = document.getElementById('faqList');
            if (!container) return;
            
            let filteredData = faqData;
            
            // Фильтрация по категории
            if (currentCategory !== "all") {
                filteredData = filteredData.filter(item => item.category === currentCategory);
            }
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="faq-empty">
                        <i class="fas fa-folder-open"></i>
                        <p>В этом разделе пока нет материалов</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            filteredData.forEach((item) => {
                const safeQuestion = escapeHtml(item.question);
                
                html += `
                    <div class="faq-item" data-category="${item.category}">
                        <div class="faq-question" onclick="toggleFAQ(this)">
                            <span>${safeQuestion}</span>
                            <i class="fas fa-chevron-right"></i>
                        </div>
                        <div class="faq-answer">
                            ${item.answer}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function toggleFAQ(element) {
            const faqItem = element.closest('.faq-item');
            if (!faqItem) return;
            faqItem.classList.toggle('open');
        }
        
        function filterByCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            
            renderFAQ();
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            renderFAQ();
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterByCategory(btn.dataset.category);
                });
            });
        });
        
        window.toggleFAQ = toggleFAQ;
        window.filterByCategory = filterByCategory;
    </script>
